<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StrataFit</title>
<style>@@CSS@@</style></head><body><div id="app"></div><div id="sh"></div>
<script>
(function(){var shown=0,T=function(m){var d=document.createElement('div');d.textContent=m;return d.innerHTML};
function fail(m){if(shown)return;shown=1;var d=document.createElement('div');d.id='ffe';d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;background:#0b0b0d;color:#f4f4f6;padding:28px 20px;overflow:auto;font:15px/1.45 system-ui,-apple-system,sans-serif';
d.innerHTML='<h2 style="margin:24px 0 8px;font-size:22px">StrataFit no ha podido iniciarse</h2><p style="color:#9a9aa6;margin:0 0 12px">Esto es lo que ha fallado. Si sigue ocurriendo, envíame una captura de este mensaje.</p><pre style="white-space:pre-wrap;word-break:break-word;background:#17171b;border-radius:12px;padding:12px;font-size:12px;color:#ffb4c0">'+T(m)+'</pre><button id="ffe1" style="width:100%;padding:15px;border-radius:14px;border:0;background:#fff;color:#111;font:700 16px system-ui;margin:10px 0">Reintentar</button><button id="ffe2" style="width:100%;padding:15px;border-radius:14px;border:1px solid #2a2a31;background:#17171b;color:#f4f4f6;font:600 15px system-ui;margin:0 0 10px">Ver mis datos (copia de seguridad)</button><button id="ffe3" style="width:100%;padding:15px;border-radius:14px;border:1px solid #5a2030;background:#17171b;color:#ff8da1;font:600 15px system-ui">Restablecer y abrir de nuevo</button><textarea id="ffe4" readonly style="display:none;width:100%;height:180px;margin-top:12px;background:#17171b;color:#f4f4f6;border:1px solid #2a2a31;border-radius:12px;padding:10px;font-size:11px"></textarea>';
document.body.appendChild(d);
document.getElementById('ffe1').onclick=function(){location.reload()};
document.getElementById('ffe2').onclick=function(){var t=document.getElementById('ffe4');try{t.value=localStorage.getItem('ff')||'(sin datos)'}catch(e){t.value='(no se puede leer el almacenamiento)'}t.style.display='block';t.focus();t.select()};
document.getElementById('ffe3').onclick=function(){try{var r=localStorage.getItem('ff');if(r)localStorage.setItem('ffbad',JSON.stringify({t:Date.now(),raw:r}))}catch(e){}try{localStorage.removeItem('ff');localStorage.removeItem('ffw')}catch(e){}location.reload()};
try{var l=JSON.parse(localStorage.getItem('fferr')||'[]');if(!Array.isArray(l))l=[];l.push({t:Date.now(),w:'arranque',m:String(m).slice(0,300),s:'',v:''});localStorage.setItem('fferr',JSON.stringify(l.slice(-30)))}catch(e){}}
window.__ffe=fail;
var last='';window.addEventListener('error',function(e){var m=(e.message||'Error')+(e.filename?'\n'+String(e.filename).split('/').pop()+':'+e.lineno+':'+e.colno:'');last=m;if(window.__ffok)return;if(window.__ffs||/SyntaxError|Unexpected|Invalid or unexpected/.test(m))fail(m)});

setTimeout(function(){if(!window.__ffok)fail((last?last+'\n\n':'')+'La aplicación no terminó de arrancar (tiempo agotado).')},7000)})();
</script>
<nav><button data-a="tab" data-i="0"><span></span>Workout</button><button data-a="tab" data-i="1"><span></span>Nutrición</button><button data-a="tab" data-i="2"><span></span>Dashboard</button><button data-a="tab" data-i="3"><span></span>Perfil</button></nav>
<script>
@@JS@@</script></body></html>
