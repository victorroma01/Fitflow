<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StrataFit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StrataFit">

<meta name="theme-color" content="#0b0b0d">
<style>/* ═══ css/00-base ═══ Variables de tema, reinicio y tipografía base */
:root {
  --bg:#0b0b0d;
  --cd:#17171b;
  --tx:#f4f4f6;
  --mu:#8b8b96;
  --ac:#9b5cf6;
  --ln:#2a2a31;
  --c:#e9567c;
  --p:#5b7bea;
  --g:#f0b244;
  --ib:#0b0b0d;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media(prefers-color-scheme:light) {
  :root:not([data-theme="dark"]) {
    --bg:#f3f3f7;
    --cd:#fff;
    --tx:#17171b;
    --mu:#6b6b76;
    --ln:#e0e0e6;
    --ib:#f3f3f7;
    color-scheme:light;
  }
}
:root[data-theme="light"] {
  --bg:#f3f3f7;
  --cd:#fff;
  --tx:#17171b;
  --mu:#6b6b76;
  --ln:#e0e0e6;
  --ib:#f3f3f7;
  color-scheme:light;
}
:root[data-theme="dark"] {
  --bg:#0b0b0d;
  --cd:#17171b;
  --tx:#f4f4f6;
  --mu:#8b8b96;
  --ln:#2a2a31;
  --ib:#0b0b0d;
  color-scheme:dark;
}
* {
  box-sizing:border-box;
}
html,body {
  margin:0;
}
body {
  background:var(--bg);
  color:var(--tx);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;
}
#app {
  padding:14px 14px 96px;
  max-width:560px;
  margin:auto;
}
button,input,select {
  font:inherit;
  color:inherit;
}
button {
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:12px;
  padding:9px 12px;
  cursor:pointer;
}
input,select,textarea {
  background:var(--ib);
  border:1px solid var(--ln);
  border-radius:10px;
  padding:8px;
  width:100%;
  min-width:0;
}
/* ═══ css/10-components ═══ Componentes base: tarjetas, cabeceras, hero, navegación, filas, barras, calendario, chips */
.pr {
  background:var(--tx);
  color:var(--bg);
  font-weight:700;
  border:0;
}
.cd {
  background:var(--cd);
  border-radius:16px;
  padding:14px;
  margin:12px 0;
}
.hd,.row,.wk {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.hd h1 {
  font-size:22px;
  margin:0;
}
small,.mu {
  color:var(--mu);
}
.dys {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin:10px 0;
}
.dy {
  padding:10px 0;
  font-size:13px;
  text-align:center;
  line-height:1.7;
}
.dy.on {
  background:var(--ac);
  color:#fff;
  border-color:var(--ac);
}
.hero {
  background:linear-gradient(160deg,#2b1a4d,var(--cd));
  padding:22px 16px;
}
.hero h2 {
  font-size:28px;
  margin:0 0 6px;
}
.st {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  text-align:center;
  margin:14px 0;
}
.st b {
  font-size:26px;
  display:block;
}
.g2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
nav {
  position:fixed;
  left:10px;
  right:10px;
  bottom:0;
  margin-bottom:max(8px,env(safe-area-inset-bottom,0px));
  display:flex;
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:26px;
  padding:6px;
  max-width:540px;
  margin-inline:auto;
  z-index:5;
}
nav button {
  flex:1;
  border:0;
  background:none;
  font-size:12px;
  border-radius:20px;
  padding:8px 2px;
}
nav button.on {
  background:var(--ln);
  font-weight:700;
}
nav span {
  display:block;
  font-size:28px;
  line-height:1.2;
}
.r {
  display:grid;
  grid-template-columns:24px 1fr 1fr 44px;
  gap:6px;
  align-items:center;
  margin:6px 0;
}
.ck {
  border-radius:50%;
  width:44px;
  height:44px;
  padding:0;
  font-size:20px;
}
.ck.on {
  background:#2f6bff;
  border-color:#2f6bff;
  color:#fff;
}
.rb {
  position:sticky;
  bottom:14px;
  background:var(--ac);
  color:#fff;
  border-radius:14px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:4;
}
.rb button {
  background:#0003;
  color:#fff;
  border:0;
}
.bk {
  position:fixed;
  inset:0;
  background:#0008;
  z-index:8;
}
.sp {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:85%;
  overflow:auto;
  background:var(--bg);
  border-radius:20px 20px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));
  z-index:9;
  max-width:560px;
  margin:auto;
}
.bar {
  height:8px;
  border-radius:6px;
  background:var(--ln);
  overflow:hidden;
  margin:4px 0;
}
.bar i {
  display:block;
  height:100%;
}
.mac {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  text-align:center;
}
.mac b {
  font-size:13px;
}
.it {
  display:grid;
  grid-template-columns:1fr 70px 24px;
  gap:6px;
  align-items:center;
  padding:7px 0;
  border-top:1px solid var(--ln);
}
.cal {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  text-align:center;
}
.cal i {
  font-style:normal;
  padding:7px 0;
  border-radius:8px;
  font-size:13px;
}
.cal .on {
  background:var(--ac);
  color:#fff;
}
.av {
  width:84px;
  height:84px;
  border-radius:50%;
  background:var(--ln);
  object-fit:cover;
  display:grid;
  place-items:center;
  font-size:34px;
  margin:auto;
  overflow:hidden;
}
.chip {
  display:inline-block;
  margin:3px 3px 0 0;
  padding:6px 10px;
  font-size:13px;
}
.chip.on {
  background:var(--ac);
  border-color:var(--ac);
  color:#fff;
}
label {
  display:block;
  font-size:13px;
  color:var(--mu);
  margin:8px 0 3px;
}
.gg {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}
.gg button {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:10px 4px;
  font-size:12px;
}
.gg b {
  font-size:13px;
}
.mb {
  display:flex;
  gap:12px;
  align-items:center;
  width:100%;
  margin:6px 0;
  padding:14px;
  text-align:left;
}
/* ═══ css/20-visual-refresh ═══ Segunda pasada visual: botones, hero, navegación, entradas y desplegables */
html {
  scroll-behavior:smooth;
}
body {
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
button {
  font-weight:600;
  transition:transform .12s,background .2s;
}
button:active {
  transform:scale(.97);
}
.cd {
  border:1px solid var(--ln);
  border-radius:20px;
  box-shadow:0 8px 24px #0002;
}
.pr {
  background:linear-gradient(135deg,#b183ff,#7a45ee);
  color:#fff;
  box-shadow:0 6px 18px #7a45ee55;
}
.hero {
  background:radial-gradient(120% 100% at 0 0,#4b2a90,var(--cd) 72%);
  border-color:#3b2a6b;
  color:#f4f4f6;
}
.hero small {
  color:#c4b5e8;
}
.hero button:not(.pr) {
  background:#ffffff1a;
  color:#fff;
  border-color:#ffffff22;
}
.hero h2 {
  font-size:30px;
  letter-spacing:-.03em;
  line-height:1.1;
}
.st b {
  font-size:28px;
  font-weight:800;
}
.st small {
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:11px;
}
.hd h1 {
  font-size:24px;
  letter-spacing:-.03em;
}
.dy {
  border-radius:14px;
}
.dy.on {
  background:linear-gradient(135deg,#b183ff,#7a45ee);
  box-shadow:0 4px 14px #7a45ee66;
}
nav {
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--cd) 82%,transparent);
  box-shadow:0 10px 30px #0004;
}
nav button.on {
  background:var(--ac);
  color:#fff;
}
input,select,textarea {
  border-radius:12px;
  padding:10px;
}
input:focus,select:focus,textarea:focus {
  outline:0;
  border-color:var(--ac);
  box-shadow:0 0 0 3px #9b5cf633;
}
.r input {
  text-align:center;
  font-weight:700;
  font-size:17px;
}
.r>span {
  text-align:center;
  color:var(--mu);
  font-weight:700;
}
.ck {
  color:var(--mu);
}
.ck.on {
  background:linear-gradient(135deg,#34d399,#10b981);
  border-color:#10b981;
  color:#fff;
}
.chip {
  border-radius:999px;
}
.chip.on {
  background:var(--ac);
}
.rb {
  border-radius:18px;
  background:linear-gradient(135deg,#b183ff,#7a45ee);
  box-shadow:0 10px 28px #7a45ee66;
}
.sp {
  border-radius:26px 26px 0 0;
  box-shadow:0 -10px 40px #0006;
}
.sp::before {
  content:"";
  display:block;
  width:40px;
  height:4px;
  border-radius:4px;
  background:var(--ln);
  margin:-6px auto 12px;
}
summary {
  font-weight:700;
  cursor:pointer;
  list-style:none;
}
summary::-webkit-details-marker {
  display:none;
}
summary::after {
  content:"›";
  float:right;
  color:var(--mu);
  transition:transform .2s;
}
details[open]>summary::after {
  transform:rotate(90deg);
}
.gg button {
  border-radius:18px;
}
.mb {
  border-radius:16px;
}
#NF,#NB,#Fc {
  fill:url(#gB);
  stroke:#15161d;
  stroke-width:.9;
}
:root {
  --a1:#b183ff;
  --a2:#7a45ee;
  --a3:#4b2a90;
  --ft:#fff;
}
.pr {
  background:linear-gradient(135deg,var(--a1),var(--a2));
  color:var(--ft);
  box-shadow:0 6px 18px color-mix(in srgb,var(--a2) 35%,transparent);
}
.dy.on {
  background:linear-gradient(135deg,var(--a1),var(--a2));
  color:var(--ft);
  border-color:var(--a2);
}
.hero {
  background:radial-gradient(120% 100% at 0 0,var(--a3),var(--cd) 72%);
}
.rb {
  background:linear-gradient(135deg,var(--a1),var(--a2));
  color:var(--ft);
}
.rb button {
  color:var(--ft);
}
nav button.on {
  background:var(--a2);
  color:var(--ft);
}
.chip.on {
  background:var(--a2);
  border-color:var(--a2);
  color:var(--ft);
}
input:focus,select:focus,textarea:focus {
  border-color:var(--a2);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 25%,transparent);
}
/* ═══ css/30-workout-session ═══ Sesión de entreno: ejercicios, series, descanso y temporizador */
.th {
  width:72px;
  height:72px;
  border-radius:14px;
  background:radial-gradient(circle at 50% 30%,#4a1620,#0e0e13 78%);
  display:grid;
  place-items:center;
  flex:none;
  overflow:hidden;
}
.ovx {
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid var(--ln);
}
.ovx .th {
  align-self:flex-start;
}
.sb {
  position:fixed;
  left:14px;
  right:14px;
  bottom:max(14px,env(safe-area-inset-bottom,0px));
  max-width:532px;
  margin:auto;
  z-index:6;
}
.hero {
  border-color:color-mix(in srgb,var(--a2) 55%,#0000);
}
.hero small {
  color:color-mix(in srgb,var(--a1) 55%,#fff);
}
.xs {
  padding:14px 0 8px;
  border-bottom:1px solid var(--ln);
}
.xh {
  display:flex;
  gap:12px;
  align-items:center;
  margin:10px 0 8px;
}
.sl {
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--mu);
}
.thd,.r2 {
  display:grid;
  grid-template-columns:26px 46px 1fr 1fr 44px 44px;
  gap:6px;
  align-items:center;
  text-align:center;
}
.thd {
  font-size:12px;
  color:var(--mu);
  margin:10px 0 4px;
}
.r2 {
  padding:6px 0;
  border-radius:12px;
}
.r2.cur {
  background:color-mix(in srgb,var(--a2) 14%,transparent);
  box-shadow:inset 3px 0 0 var(--a2);
}
.r2 input {
  text-align:center;
  font-weight:700;
  font-size:17px;
  padding:12px 4px;
}
.wk2 {
  font-size:11px;
  font-weight:700;
  padding:7px 0;
  border-radius:8px;
  background:var(--ln);
}
.r2.cur .wk2 {
  background:var(--a2);
  color:var(--ft);
}
.rr {
  display:grid;
  grid-template-columns:84px 1fr 84px;
  gap:8px;
  align-items:center;
  padding:8px 6px;
  margin:2px 0;
  text-align:center;
  background:color-mix(in srgb,var(--a2) 12%,transparent);
  border-radius:14px;
}
.rr b {
  font-size:22px;
  color:var(--a1);
}
.pb {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-width:560px;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--cd) 92%,transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--ln);
  border-radius:26px 26px 0 0;
  z-index:6;
}
.pb button {
  background:none;
  border:0;
  padding:10px 18px;
}
/* ═══ css/40-sheets-motion ═══ Hojas inferiores, animaciones, selectores de acento y controles segmentados */
.hero {
  position:relative;
}
.chip {
  display:inline-flex;
  gap:6px;
  align-items:center;
}
* {
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible {
  outline:2px solid var(--a2);
  outline-offset:2px;
}
.bk {
  animation:fdi .25s ease;
}
.sp {
  animation:upi .32s cubic-bezier(.2,.8,.2,1);
}
@keyframes fdi {
  from {
    opacity:0;
  }
}
@keyframes upi {
  from {
    transform:translateY(100%);
  }
}
@keyframes rsi {
  from {
    opacity:0;
    transform:translateY(10px);
  }
}
@keyframes slr {
  from {
    transform:translateX(100%);
  }
}
.sp .mb,.sp .it,.sp .cd {
  animation:rsi .35s both;
}
.sp .mb:nth-child(2) {
  animation-delay:.04s;
}
.sp .mb:nth-child(3) {
  animation-delay:.08s;
}
.sp .mb:nth-child(4) {
  animation-delay:.12s;
}
.sp .mb:nth-child(5) {
  animation-delay:.16s;
}
details[open]>:not(summary) {
  animation:rsi .28s both;
}
#sh.full .bk {
  display:none;
}
#sh.full .sp {
  top:0;
  height:100%;
  max-height:100%;
  border-radius:0;
  animation:slr .32s cubic-bezier(.2,.8,.2,1);
}
.swg {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px 8px;
  margin-top:8px;
}
.swb {
  background:none;
  border:0;
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.swb i {
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-style:normal;
  font-weight:800;
  transition:transform .2s,box-shadow .2s;
}
.swb.on i {
  box-shadow:0 0 0 3px var(--cd),0 0 0 5px var(--tx);
  transform:scale(1.06);
}
.swb small {
  font-size:11px;
  color:var(--mu);
}
.seg {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:var(--ib);
  border:1px solid var(--ln);
  border-radius:14px;
  padding:3px;
  gap:3px;
  margin-top:6px;
}
.seg button {
  border:0;
  background:none;
  padding:9px;
  border-radius:11px;
}
.seg button.on {
  background:var(--a2);
  color:var(--ft);
}
@media(prefers-reduced-motion:reduce) {
  * {
    animation:none!important;
    transition:none!important;
  }
}
/* ═══ css/50-dialogs-menus ═══ Diálogos, menú lateral, avisos y chips desplazables */
.tg {
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:12px;
  padding:7px 12px;
  font-size:14px;
}
.dgb {
  position:fixed;
  inset:0;
  background:#000a;
  z-index:20;
  display:grid;
  place-items:center;
  padding:24px;
  animation:fdi .2s;
}
.dgc {
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:22px;
  padding:20px;
  max-width:360px;
  width:100%;
  animation:rsi .25s;
  box-shadow:0 24px 60px #0008;
}
.mbk {
  position:fixed;
  inset:0;
  background:#0006;
  z-index:14;
  animation:fdi .25s;
}
.mst {
  position:fixed;
  top:0;
  left:0;
  right:0;
  max-width:560px;
  margin:auto;
  z-index:15;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;
  background:color-mix(in srgb,var(--cd) 97%,transparent);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--ln);
  border-top:0;
  border-radius:0 0 24px 24px;
  animation:mdn .38s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 18px 40px #0005;
}
.mst.out {
  animation:mup .22s ease-in forwards;
}
@keyframes mdn {
  from {
    transform:translateY(-100%);
    opacity:0;
  }
}
@keyframes mup {
  to {
    transform:translateY(-100%);
    opacity:0;
  }
}
.mti {
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--mu);
  margin:2px 8px 2px;
  opacity:.8;
}
.mgr {
  width:36px;
  height:4px;
  border-radius:4px;
  background:var(--ln);
  margin:2px auto 0;
  cursor:pointer;
  padding:0;
}
.mgr::after {
  content:'';
  position:absolute;
  left:0;
  right:0;
  height:22px;
  margin-top:-8px;
}
.mrow {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.mrow button {
  background:none;
  border:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:10px 2px;
  font-size:11px;
  font-weight:600;
  border-radius:16px;
  color:var(--mu);
}
.mrow button:active {
  background:var(--ln);
  color:var(--tx);
}
.tst {
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  transform:translateX(-50%);
  background:var(--tx);
  color:var(--bg);
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  z-index:30;
  animation:rsi .3s;
  box-shadow:0 10px 30px #0006;
  white-space:nowrap;
}
.mbk {

const loadSavedState = () => {
  let raw = null;
  try {
    raw = Store.get(Store.K.app);
  }
  catch (e) {
    logError('leer estado', e);
    return {};
  }
  if (raw == null)
    return {};
  try {
    const o = JSON.parse(raw);
    if (o === null)
      return {};
    if (typeof o == 'object' && !Array.isArray(o))
      return o;
    throw new Error('el estado guardado no es un objeto');
  }
  catch (e) {
    logError('estado dañado', e);
    stateRecovered = 1;
    try {
      Store.set(Store.K.bad, JSON.stringify({ t: Date.now(), raw }));
    }
    catch (x) {
      logError('apartar estado dañado', x);
    }
    return {};
  }
};

const downloadAs = async (name, data, mime) => {
  let d = null;
  try {
    d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  }
  catch (e) {
    d = null;
  }
  if (d) {
    try {
      const r = await d.save({ filename: name, data });
      return r && r.status ? r.status : 'saved';
    }
    catch (e) {
      return e && e.code == 'declined' ? 'declined' : 'fail';
    }
  }
  if (isStandalone() && navigator.canShare && typeof File != 'undefined') {
    try {
      const f = new File([data], name, { type: mime });
      if (navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f] });
        return 'saved';
      }
    }
    catch (e) {
      if (e && e.name == 'AbortError')
        return 'declined';
    }
  }
  try {
    const b = new Blob([data], { type: mime });
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    return 'saved';
  }
  catch (e) {
    return 'fail';
  }
};
