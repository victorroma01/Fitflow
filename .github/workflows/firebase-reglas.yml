# Desplegar en Firebase las reglas de seguridad y los índices de Firestore (firestore.rules y firestore.indexes.json).
# Solo desde main: se lanza solo al fusionar un cambio de esos archivos (o a mano, desde main). Antes, la CI los prueba
# con el emulador en cada cambio (pruebas.yml, «Reglas y nube»).
# Con firebase-admin (tools/admin/reglas.mjs) y no con firebase-tools, que antes de desplegar comprueba qué APIs tiene
# activas el proyecto, y la cuenta de servicio no tiene permiso para eso.
name: Desplegar reglas

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - tools/admin/reglas.mjs
      - .github/workflows/firebase-reglas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-firebase
  cancel-in-progress: false

jobs:
  desplegar:
    name: Reglas e índices de Firestore
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - name: firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@13
      # la clave llega solo como variable de entorno del paso (tools/admin/firebase.mjs), nunca al repositorio ni al registro
      - name: Desplegar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/admin/reglas.mjs
