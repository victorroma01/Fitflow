# Desplegar en Firebase las reglas de seguridad de Firestore (firestore.rules).
# Solo desde main. Al publicar, lo llama pruebas.yml cuando cambian las reglas, después de las pruebas y antes de publicar la
# app (T-24, V1.0.2): una app nueva nunca llega antes que las reglas que necesita. También se puede lanzar a mano, desde main.
# Antes, la CI prueba las reglas con el emulador en cada cambio (pruebas.yml, «Reglas y nube»).
# Con firebase-admin (tools/admin/reglas.mjs) y no con firebase-tools, que antes de desplegar comprueba qué APIs tiene
# activas el proyecto, y la cuenta de servicio no tiene permiso para eso.
name: Desplegar reglas

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    name: Reglas de Firestore
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # uno detrás de otro con los demás flujos que usan la cuenta de servicio (Comprobar Firebase, Asignar rol…)
    concurrency:
      group: admin-firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - name: firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@13
      # la clave llega solo como variable de entorno del paso (tools/admin/firebase.mjs), nunca al repositorio ni al registro
      - name: Desplegar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/admin/reglas.mjs
