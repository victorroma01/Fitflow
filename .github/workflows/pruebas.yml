# Pruebas y publicación de StrataFit.
#  · En cada solicitud de fusión y en cada cambio en main o en una rama de desarrollo (desarrollo-1.0.2, desarrollo-…): compilar
#    y probar en Chrome (Chromium) y en Safari (WebKit), y las reglas de Firestore y la nube con el emulador de Firebase. En
#    las ramas de desarrollo no se etiqueta ni se publica nada.
#  · En las solicitudes de fusión, además: comparar con la versión anterior (informativo, salvo con la etiqueta «refactor»).
#  · Siempre: decir desde dónde publica GitHub Pages y, si publica desde la rama, comprobar que la copia de la raíz es la app
#    compilada de este código (tools/pages.py).
#  · En main, si todo pasa: etiqueta vX.Y.Z con sus notas (de CHANGELOG.md) la primera vez que aparece una versión y,
#    si GitHub Pages publica desde GitHub Actions (Settings → Pages → Source), publica la app.
name: Pruebas

on:
  push:
    branches: [main, 'desarrollo-*']
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      # avisos de seguridad conocidos de las dependencias de desarrollo (la app publicada no lleva ninguna librería: solo se usan
      # para compilar y probar). No detiene la publicación, pero queda anotado en la ejecución para revisarlo
      - name: Avisos de seguridad de las dependencias (npm audit)
        run: |
          npm audit --audit-level=high || echo "::warning title=npm audit::Hay avisos de seguridad altos o críticos en las dependencias de desarrollo (esbuild, acorn o typescript): revísalos con npm audit"
      - name: Formato, compilación, reglas y pruebas
        run: bash tests/run.sh
      # con «Deploy from a branch» lo publicado es la copia de la raíz: tiene que ser la app que sale de este código
      - name: Copia publicada (GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          modo=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo desconocido)
          python3 tools/pages.py comprobar "$modo"

  safari:
    name: Probar en Safari (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps webkit
      # mismas pruebas con el motor de Safari; la app se sirve por HTTP, como en GitHub Pages (tests/browser.py)
      - name: Pruebas en WebKit
        env:
          SF_BROWSER: webkit
        run: bash tests/run.sh

  # informativo: las mismas pruebas con el motor de Firefox (Gecko). No detiene la publicación: quien usa la app está en Safari
  # (iPhone) o en Chrome (Android), que son los dos trabajos de arriba; sirve para saber si algo depende de un solo motor
  firefox:
    name: Probar en Firefox (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps firefox
      - name: Sonda (temporal)
        env:
          SF_BROWSER: firefox
        run: |
          python3 build.py
          python3 tests/_probe.py dist/stratafit.html || true
      - name: Pruebas en Firefox
        env:
          SF_BROWSER: firefox
        run: bash tests/run.sh

  # cuentas y nube: las reglas de Firestore (tests/rules.test.mjs) y la app con el emulador de Firebase (tests/cloud.py), con
  # firestore.rules de verdad y los scripts de administración (tools/admin)
  nube:
    name: Reglas y nube (emulador de Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund firebase-tools@15 firebase-admin@13
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compilar con el emulador
        run: python3 build.py --emulador
      - name: Reglas y app con el emulador
        env:
          SF_CLOUD: emulador
        run: npx firebase emulators:exec --only auth,firestore --project demo-stratafit "node --test tests/rules.test.mjs && python3 tests/cloud.py dist/emu/stratafit.html"

  equivalencia:
    name: Comparar con la versión anterior
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compilar las dos versiones
        run: |
          python3 build.py --only single
          cp dist/stratafit.html /tmp/nueva.html
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && npm install --no-audit --no-fund && python3 build.py --only single)
      - name: Paseo aleatorio y capturas
        id: comparar
        continue-on-error: true
        run: bash tests/compare.sh /tmp/base/dist/stratafit.html /tmp/nueva.html 0,1,2,3 150
      # informativo, salvo con la etiqueta «refactor» (un cambio que no debe alterar nada): entonces cualquier diferencia falla
      - name: Resultado
        env:
          REFACTOR: ${{ contains(github.event.pull_request.labels.*.name, 'refactor') }}
          RESULTADO: ${{ steps.comparar.outcome }}
        run: |
          if [ "$RESULTADO" = "success" ]; then echo "Sin diferencias con la versión anterior"; exit 0; fi
          echo "::notice::Hay diferencias de comportamiento o de imagen con la versión anterior (ver el paso anterior)"
          if [ "$REFACTOR" = "true" ]; then echo "La etiqueta refactor exige que no haya diferencias"; exit 1; fi

  version:
    name: Etiquetar la versión
    needs: [pruebas, safari, nube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.modo }}
      reglas: ${{ steps.reglas.outputs.cambian }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # ¿cambian las reglas (o cómo se despliegan) con esta publicación? Si no se sabe (primera subida), sí
      - name: ¿Cambian las reglas de Firestore?
        id: reglas
        env:
          ANTES: ${{ github.event.before }}
        run: |
          if [ -z "$ANTES" ] || [ "$ANTES" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then cambian=si
          elif git diff --quiet "$ANTES" "$GITHUB_SHA" -- firestore.rules tools/admin/reglas.mjs .github/workflows/firebase-reglas.yml; then cambian=no
          else cambian=si; fi
          echo "cambian=$cambian" >> "$GITHUB_OUTPUT"
          if [ "$cambian" = si ]; then echo "::notice::Las reglas de Firestore cambian: se despliegan antes de publicar la app"; else echo "Las reglas de Firestore no cambian"; fi
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compilar el paquete
        run: |
          npm install --no-audit --no-fund
          python3 build.py --only app
      - name: Paquete para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/app
      - name: ¿GitHub Pages publica desde aquí?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          modo=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo ninguno)
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          if [ "$modo" != workflow ]; then
            echo "::notice::GitHub Pages publica desde la rama (modo: $modo): la app publicada son los archivos de la raíz. Para publicar desde aquí, en Settings → Pages → Source elige «GitHub Actions»."
          fi
      - name: Etiqueta y notas de la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 build.py --version)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "La versión v$v ya está etiquetada"; exit 0; fi
          python3 build.py --notes > notas.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "StrataFit $v" --notes-file notas.md
          echo "::notice::Publicada la versión v$v"

  # primero las reglas (si cambian) y después la app (T-24): la app nueva nunca llega antes que las reglas que necesita
  reglas:
    name: Desplegar reglas de Firestore
    needs: version
    if: needs.version.outputs.reglas == 'si'
    permissions:
      contents: read
    uses: ./.github/workflows/firebase-reglas.yml
    secrets: inherit

  pages:
    name: Publicar en GitHub Pages
    needs: [version, reglas]
    if: always() && needs.version.result == 'success' && needs.version.outputs.pages == 'workflow' && (needs.reglas.result == 'success' || needs.reglas.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
