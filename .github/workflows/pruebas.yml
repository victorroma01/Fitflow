# Pruebas automáticas de StrataFit: se ejecutan en cada cambio en main y en cada solicitud de fusión.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Formato, compilación, reglas y pruebas
        run: bash tests/run.sh

  equivalencia:
    name: Comparar con la versión anterior
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # solo falla si la solicitud lleva la etiqueta «refactor» (un cambio que no debe alterar nada); si no, es informativa
    continue-on-error: ${{ !contains(github.event.pull_request.labels.*.name, 'refactor') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Compilar las dos versiones
        run: |
          python3 build.py --only single
          cp dist/stratafit.html /tmp/nueva.html
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && python3 build.py --only single)
      - name: Paseo aleatorio y capturas
        run: bash tests/compare.sh /tmp/base/dist/stratafit.html /tmp/nueva.html 0,1,2,3 150
